<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1F1410;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1A0E08;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#120D08;stop-opacity:1"/>
    </linearGradient>
    <pattern id="kente" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="24" fill="#D4A24C" fill-opacity="0.08"/>
      <rect x="24" y="24" width="24" height="24" fill="#D4A24C" fill-opacity="0.08"/>
      <rect x="8" y="8" width="8" height="8" fill="#A64B2A" fill-opacity="0.09"/>
      <rect x="32" y="32" width="8" height="8" fill="#A64B2A" fill-opacity="0.09"/>
    </pattern>
    <pattern id="adinkra" x="0" y="0" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="36" cy="36" r="26" fill="none" stroke="#A64B2A" stroke-opacity="0.07" stroke-width="0.8"/>
      <circle cx="36" cy="36" r="16" fill="none" stroke="#A64B2A" stroke-opacity="0.07" stroke-width="0.8"/>
      <line x1="10" y1="36" x2="62" y2="36" stroke="#A64B2A" stroke-opacity="0.06" stroke-width="0.6"/>
      <line x1="36" y1="10" x2="36" y2="62" stroke="#A64B2A" stroke-opacity="0.06" stroke-width="0.6"/>
    </pattern>
  </defs>
  <!-- Base -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Kente pattern layer -->
  <rect width="800" height="500" fill="url(#kente)"/>
  <!-- Adinkra overlay -->
  <rect width="800" height="500" fill="url(#adinkra)"/>
  <!-- Warm glow - top left -->
  <radialGradient id="g1" cx="20%" cy="30%" r="40%">
    <stop offset="0%" style="stop-color:#A64B2A;stop-opacity:0.18"/>
    <stop offset="100%" style="stop-color:#A64B2A;stop-opacity:0"/>
  </radialGradient>
  <rect width="800" height="500" fill="url(#g1)"/>
  <!-- Gold glow - bottom right -->
  <radialGradient id="g2" cx="80%" cy="70%" r="35%">
    <stop offset="0%" style="stop-color:#D4A24C;stop-opacity:0.12"/>
    <stop offset="100%" style="stop-color:#D4A24C;stop-opacity:0"/>
  </radialGradient>
  <rect width="800" height="500" fill="url(#g2)"/>
  <!-- Top border line -->
  <line x1="0" y1="2" x2="800" y2="2" stroke="#A64B2A" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Central image icon area -->
  <rect x="310" y="165" width="180" height="170" rx="20" fill="#A64B2A" fill-opacity="0.1" stroke="#A64B2A" stroke-opacity="0.22" stroke-width="1"/>
  <!-- Camera body -->
  <rect x="340" y="195" width="120" height="85" rx="10" fill="#A64B2A" fill-opacity="0.18" stroke="#D4A24C" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Camera lens -->
  <circle cx="400" cy="250" r="30" fill="#1F1410" stroke="#D4A24C" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="400" cy="250" r="20" fill="#A64B2A" fill-opacity="0.25"/>
  <circle cx="400" cy="250" r="10" fill="#D4A24C" fill-opacity="0.35"/>
  <circle cx="400" cy="250" r="4" fill="#D4A24C" fill-opacity="0.6"/>
  <!-- Camera top bump -->
  <rect x="375" y="183" width="50" height="16" rx="5" fill="#A64B2A" fill-opacity="0.22" stroke="#D4A24C" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Flash -->
  <rect x="446" y="197" width="12" height="8" rx="3" fill="#D4A24C" fill-opacity="0.3"/>
  <!-- Label bars -->
  <rect x="240" y="368" width="320" height="8" rx="4" fill="#D4A24C" fill-opacity="0.2"/>
  <rect x="290" y="388" width="220" height="6" rx="3" fill="#A64B2A" fill-opacity="0.18"/>
  <!-- Decorative Ndebele corner accents -->
  <polyline points="30,30 30,80 50,80" fill="none" stroke="#D4A24C" stroke-opacity="0.25" stroke-width="1.5"/>
  <polyline points="770,30 770,80 750,80" fill="none" stroke="#D4A24C" stroke-opacity="0.25" stroke-width="1.5"/>
  <polyline points="30,470 30,420 50,420" fill="none" stroke="#D4A24C" stroke-opacity="0.25" stroke-width="1.5"/>
  <polyline points="770,470 770,420 750,420" fill="none" stroke="#D4A24C" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- Subtle horizontal divider lines -->
  <line x1="40" y1="140" x2="760" y2="140" stroke="#A64B2A" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="40" y1="360" x2="760" y2="360" stroke="#A64B2A" stroke-opacity="0.08" stroke-width="0.5"/>
</svg>
