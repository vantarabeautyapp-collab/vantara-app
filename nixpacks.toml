# Nixpacks build config for Railway
# Locks Node 20, installs ALL deps, binds to 0.0.0.0 for Railway networking

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "npm run build",
  "node scripts/copy-standalone.js"
]

[start]
cmd = "HOSTNAME=0.0.0.0 node .next/standalone/server.js"
