# Nixpacks build config for Railway
# Locks Node 20, installs ALL deps (including types), allocates build memory

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = [
  "npm run build",
  "node scripts/copy-standalone.js"
]

[start]
cmd = "node .next/standalone/server.js"
